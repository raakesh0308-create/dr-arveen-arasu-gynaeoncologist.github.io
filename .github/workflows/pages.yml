# Publishes the repository root to GitHub Pages on every push to main.
# Use this only if you choose "GitHub Actions" as the Pages source (see DEPLOYMENT.md, option B).
name: Deploy DR ARVEEN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check page scripts for syntax errors
        run: node --check assets/app.js && node --check assets/patient-data.js && node --check assets/config.js
      - name: Refuse to publish professional content
        run: |
          if [ -e assets/data.js ] || grep -q "pro_content" assets/patient-data.js; then
            echo "Professional content must not be in the public site"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
