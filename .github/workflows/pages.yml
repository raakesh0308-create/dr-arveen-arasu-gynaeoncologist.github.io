# Publishes the repository root to GitHub Pages on every push to main.
# Use this only if you choose "GitHub Actions" as the Pages source (see DEPLOYMENT.md, option B).
name: Deploy DR ARVEEN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Safety checks (no professional content or secret keys, all pages present, scripts valid)
        run: node tools/check.mjs
      - name: Colour contrast meets WCAG AA in light and dark mode
        run: node tools/contrast.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
